name: Terraform Lint

permissions:
  contents: read

on:
  pull_request:
    branches:
      - main

jobs:
  terraform-lint:
    name: Lint Terraform code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.0.0

      - name: Terraform Init
        id: init
        run: terraform init -input=false  
    
      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Format Diff
        if: failure()
        run: terraform fmt -diff -recursive

      - name: Terraform Validate (Example)
        run: |
          cd example
          terraform init -input=false
          terraform validate

  go-unit-tests:
    name: Run Go unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'

      # Excludes the AWS-credentialed Terratest suite (build-tagged "integration",
      # run nightly in scheduled-test.yml) so this stays fast and credential-free.
      - name: Run unit tests
        working-directory: test
        run: go test -v ./...
